name: Verify add-on

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and smoke-test the add-on image
        run: ./scripts/verify_addon.sh

  energy-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install real Home Assistant Core
        run: python -m pip install homeassistant==2026.9.4 websockets==15.0.1
      - name: Verify external Energy statistics in isolated Core
        run: |
          config="$RUNNER_TEMP/ute-core-config"
          mkdir -p "$config"
          cp scripts/fixtures/core-configuration.yaml "$config/configuration.yaml"
          python -m homeassistant --config "$config" > "$RUNNER_TEMP/ute-core.log" 2>&1 &
          core_pid=$!
          trap 'kill "$core_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import requests
          for _ in range(120):
              try:
                  if requests.get('http://127.0.0.1:18123/api/onboarding', timeout=2).status_code == 200:
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Isolated Core did not become ready')
          PY
          python scripts/verify_energy_core.py
      - name: Upload Core log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-core-log
          path: ${{ runner.temp }}/ute-core.log
